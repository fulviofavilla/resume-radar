name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (weasyprint)
        run: sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2 fonts-liberation

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pytest tests/ -v

  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        # chromadb server-side advisories (Python FastAPI server only). We use
        # chromadb.HttpClient against the chromadb/chroma Docker image (Rust
        # server). No fixed releases yet; remove once chromadb > 1.5.9 ships.
        #   PYSEC-2026-311  CVE-2026-45829  pre-auth code injection
        #   PYSEC-2026-3813 CVE-2026-45830  cross-tenant data access
        #   PYSEC-2026-3814 CVE-2026-45833  code injection (authenticated)
        #   PYSEC-2026-3815 CVE-2026-45831  RBAC ignores tenant scope
        run: >
          pip-audit -r requirements.txt --progress-spinner off
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815